publish_to: none
version: 1.0.0
environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.50.0'
dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.11.1
  neural_engine:
    path: ../..
  shared_preferences: ^2.5.6
  url_launcher: ^6.3.3
dev_dependencies:
  lints: ">=3.0.0 <7.0.0"
  flutter_test:
    sdk: flutter
flutter:
  uses-material-design: true
