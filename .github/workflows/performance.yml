name: Performance evidence
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'benchmark/profiling/**'
      - 'validation/profile_allocations.py'
      - '.github/workflows/performance.yml'
permissions:
  contents: read
jobs:
  allocations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - run: dart pub get
      - uses: actions/checkout@v4
        with:
          ref: v0.3.0
          path: baseline
      - run: dart pub get
        working-directory: baseline
      - run: python3 validation/profile_allocations.py --packages baseline/.dart_tool/package_config.json --out evidence/allocations-0.3.0.json
      - run: python3 validation/profile_allocations.py --packages .dart_tool/package_config.json --out evidence/allocations-current.json
      - uses: actions/upload-artifact@v4
        with:
          name: allocation-evidence
          path: evidence/*.json
  release-frames:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev ninja-build xvfb
      - run: flutter create --platforms linux --no-pub .
        working-directory: example/flutter_lab
      - run: flutter pub get
        working-directory: example/flutter_lab
      - run: flutter build linux --release -t lib/frame_probe_main.dart
        working-directory: example/flutter_lab
      - name: Native release frames on named CI host
        working-directory: example/flutter_lab
        shell: bash
        run: |
          mkdir -p /tmp/neural-release-frames
          for policy in default budgeted; do
            timeout 90s xvfb-run -a env NEURAL_FRAME_POLICY="$policy" NEURAL_FRAME_REPORT="/tmp/neural-release-frames/native-$policy.json" build/linux/x64/release/bundle/neural_engine_lab
          done
          timeout 90s xvfb-run -a env NEURAL_FRAME_POLICY=budgeted NEURAL_FRAME_EXECUTION=cooperative NEURAL_FRAME_REPORT=/tmp/neural-release-frames/native-cooperative.json build/linux/x64/release/bundle/neural_engine_lab
      - run: flutter build web --release --no-web-resources-cdn -t lib/frame_probe_main.dart
        working-directory: example/flutter_lab
      - run: node validation/chrome_release_trace.cjs example/flutter_lab/build/web /tmp/neural-release-frames/chrome-default.json default
      - run: node validation/chrome_release_trace.cjs example/flutter_lab/build/web /tmp/neural-release-frames/chrome-budgeted.json budgeted
      - name: Record named runner and build metadata
        shell: bash
        run: |
          flutter --version --machine > /tmp/neural-release-frames/flutter-sdk.json
          python3 - <<'PY'
          import json, os, platform, pathlib
          cpu = next((line.split(':',1)[1].strip() for line in pathlib.Path('/proc/cpuinfo').read_text().splitlines() if line.startswith('model name')), None)
          pathlib.Path('/tmp/neural-release-frames/runner-metadata.json').write_text(json.dumps({'host':'GitHub Actions virtual Linux release host','cpu':cpu,'architecture':platform.machine(),'logicalProcessors':os.cpu_count(),'image':os.getenv('ImageOS'),'imageVersion':os.getenv('ImageVersion'),'runId':os.getenv('GITHUB_RUN_ID'),'sourceCommit':os.getenv('GITHUB_SHA')}, indent=2))
          PY
      - run: python3 validation/compare_frame_reports.py /tmp/neural-release-frames
      - uses: actions/upload-artifact@v4
        with:
          name: release-frame-evidence
          path: /tmp/neural-release-frames/*
