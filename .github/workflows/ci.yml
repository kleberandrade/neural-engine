name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  dart:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        sdk: ['3.3.4', stable]
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: ${{ matrix.sdk }}
      - run: dart pub get
      - run: dart pub get
        working-directory: example/extensions
      - run: dart analyze --fatal-infos
        working-directory: example/extensions
      - run: dart run main.dart
        working-directory: example/extensions
      - run: dart format --output=none --set-exit-if-changed lib test example benchmark validation
        if: matrix.sdk == 'stable'
      - run: dart analyze --fatal-infos
      - run: dart test
      - run: dart run example/neural_engine_example.dart
      - run: dart run example/regression.dart
      - run: dart run example/classification.dart
      - run: dart run example/som_colors.dart
      - run: dart run example/cnn_bars.dart
      - run: dart run example/autoencoder.dart
      - run: dart run example/recurrent_sequences.dart
      - run: dart run example/real_world.dart
      - run: dart run example/forecast_validation.dart
      - run: dart run example/evaluation.dart
      - run: dart run example/custom_extensions.dart
      - run: dart run validation/async_portability.dart
      - run: dart run example/async_training.dart
      - run: dart run example/checkpoint.dart
      - run: dart compile js example/forecast_validation.dart -o /tmp/forecast_validation.js
      - run: node validation/run_async_js.cjs /tmp/forecast_validation.js "Validation-only forecasting passed"
      - run: dart compile js example/real_world.dart -o /tmp/real_world.js
      - run: node validation/run_async_js.cjs /tmp/real_world.js "Real-world examples passed"
      - run: dart compile js example/neural_engine_example.dart -o /tmp/neural_engine.js
      - run: dart compile js example/som_colors.dart -o /tmp/som.js
      - run: dart compile js example/cnn_bars.dart -o /tmp/cnn.js
      - run: dart compile js example/autoencoder.dart -o /tmp/autoencoder.js
      - run: node /tmp/som.js
      - run: node /tmp/cnn.js
      - run: node /tmp/autoencoder.js
      - run: dart compile js example/recurrent_sequences.dart -o /tmp/recurrent.js
      - run: node /tmp/recurrent.js
      - run: dart compile js example/checkpoint.dart -o /tmp/checkpoint.js
      - run: dart compile js example/async_training.dart -o /tmp/async_training.js
      - run: node validation/run_async_js.cjs /tmp/async_training.js
      - run: dart compile js validation/async_portability.dart -o /tmp/async_portability.js
      - run: node validation/run_async_js.cjs /tmp/async_portability.js
      - run: node /tmp/checkpoint.js
      - run: dart compile js example/custom_extensions.dart -o /tmp/extensions.js
      - run: node /tmp/extensions.js
      - run: dart pub publish --dry-run
        if: matrix.sdk == 'stable'
  flutter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: example/flutter_lab
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.50.0'
          cache: true
      - run: flutter pub get
      - run: flutter analyze --fatal-infos
      - run: flutter test --exclude-tags benchmark
      - name: Measure native Flutter test runtime
        shell: bash
        run: flutter test test/responsiveness_test.dart --reporter expanded | tee /tmp/neural-native.log
      - name: Measure Chrome Flutter test runtime
        shell: bash
        run: flutter test --platform chrome test/responsiveness_test.dart --reporter expanded | tee /tmp/neural-chrome.log
      - name: Measure fixed-batch native yield policies
        shell: bash
        run: flutter test test/yield_frequency_test.dart --reporter expanded | tee /tmp/neural-yield-native.log
      - name: Measure fixed-batch Chrome yield policies
        shell: bash
        run: flutter test --platform chrome test/yield_frequency_test.dart --reporter expanded | tee /tmp/neural-yield-chrome.log
      - name: Extract responsiveness reports
        run: |
          python3 ../../validation/extract_measurements.py /tmp/neural-native.log /tmp/neural-metrics/flutter-native.json
          python3 ../../validation/extract_measurements.py /tmp/neural-chrome.log /tmp/neural-metrics/flutter-chrome.json
          python3 ../../validation/extract_measurements.py /tmp/neural-yield-native.log /tmp/neural-metrics/yield-native.json NEURAL_YIELD 10
          python3 ../../validation/extract_measurements.py /tmp/neural-yield-chrome.log /tmp/neural-metrics/yield-chrome.json NEURAL_YIELD 10
      - uses: actions/upload-artifact@v4
        with:
          name: flutter-responsiveness
          path: /tmp/neural-metrics/*.json
      - run: flutter build web --release --no-web-resources-cdn --base-href /neural-engine/
      - uses: actions/upload-artifact@v4
        with:
          name: neural-lab-web
          path: example/flutter_lab/build/web
  hosted:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        sdk: ['3.3.4', stable]
    defaults:
      run:
        working-directory: validation/hosted
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: ${{ matrix.sdk }}
      - run: dart pub get
      - run: dart pub deps --json
      - run: dart analyze --fatal-infos
      - run: dart run main.dart

  pages:
    name: Publish neural network laboratory
    needs: [dart, flutter, hosted]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/download-artifact@v4
        with:
          name: neural-lab-web
          path: public
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - uses: actions/deploy-pages@v4
        id: deployment
