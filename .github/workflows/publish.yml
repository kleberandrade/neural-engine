name: Publish to pub.dev
on:
  push:
    tags: ['v[0-9]*.[0-9]*.[0-9]*']
permissions:
  contents: read
jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require a stable tag matching pubspec.yaml
        run: |
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          tag = os.environ['GITHUB_REF_NAME']
          version = re.search(r'^version:\s*(\S+)\s*$', Path('pubspec.yaml').read_text(), re.M).group(1)
          if not re.fullmatch(r'v\d+\.\d+\.\d+', tag) or tag != f'v{version}':
              raise SystemExit(f'Release tag {tag} must match stable pubspec version v{version}')
          print(f'Validated {tag}')
          PY
  checks:
    needs: version
    uses: ./.github/workflows/ci.yml
  publish:
    needs: checks
    permissions:
      contents: read
      id-token: write
    uses: dart-lang/setup-dart/.github/workflows/publish.yml@v1
